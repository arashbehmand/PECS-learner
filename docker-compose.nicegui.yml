version: '3.8'

services:
  pecs-nicegui:
    build:
      context: .
      dockerfile: Dockerfile.nicegui
    container_name: pecs-learning-nicegui
    ports:
      - "8080:8080"
    volumes:
      # Persist database
      - ./data:/app/data
      # Mount .env for API keys (if using AI features)
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - NICEGUI_STORAGE_PATH=/app/data/nicegui_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for HTTPS (recommended for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: pecs-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - pecs-nicegui
  #   restart: unless-stopped

volumes:
  pecs-data:
    driver: local
