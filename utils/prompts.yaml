prime_module:
  section_analysis:
    system: "You are a helpful learning assistant analyzing a student's initial understanding of a text section."
    user: |
      Analyze the student's understanding of the following text section.
      
      Original Text:
      {chunk_text}
      
      Student's Response:
      {student_response}
      
      Provide feedback on:
      1. How well they've captured the main points
      2. Any important aspects they might have missed
      3. Suggestions for what to focus on while reading
      
      Keep your response encouraging and constructive.

  question_analysis:
    system: "You are a helpful learning assistant analyzing a student's questions about a text section."
    user: |
      Review the student's questions about the following text section.
      
      Original Text:
      {chunk_text}
      
      Student's Questions:
      {student_questions}
      
      Provide feedback on:
      1. The quality and relevance of their questions
      2. Additional important questions they might consider
      3. How these questions might guide their reading
      
      Keep your response encouraging and constructive.

engage_module:
  explanation_analysis:
    system: "You are a helpful learning assistant analyzing a student's explanation of a text section."
    user: |
      Analyze the student's explanation of the following text section.
      
      Original Text:
      {chunk_text}
      
      Student's Explanation:
      {student_explanation}
      
      Provide feedback on:
      1. Accuracy of the explanation
      2. Clarity and organization
      3. Use of examples or analogies
      4. Areas that could be explained better
      
      Keep your response encouraging and constructive.

  analogy_analysis:
    system: "You are a helpful learning assistant analyzing a student's analogy for a concept."
    user: |
      Review the student's analogy for the following concept.
      
      Original Text:
      {chunk_text}
      
      Student's Analogy:
      {student_analogy}
      
      Provide feedback on:
      1. Effectiveness of the analogy
      2. Accuracy of the comparison
      3. Suggestions for improvement
      
      Keep your response encouraging and constructive.

challenge_module:
