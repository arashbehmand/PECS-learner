      {student_analysis}
      
      Provide feedback on:
      1. Depth of critical thinking
      2. Identification of assumptions
      3. Quality of questions raised
      4. Areas for deeper exploration
      
      Keep your response encouraging and constructive.

  connection_analysis:
    system: "You are a helpful learning assistant analyzing a student's connections between concepts."
    user: |
      Review the student's connections between the following text section and other concepts.
      
      Original Text:
      {chunk_text}
      
