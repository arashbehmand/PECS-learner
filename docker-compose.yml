version: '3.8'

services:
  pecs-app:
    build: .
    container_name: pecs-learning-nicegui
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database outside container
      - ./data:/app/data
      # Mount .env for API keys (optional)
      - ./.env:/app/.env:ro
      # Mount code for development (optional - remove in production)
      # - .:/app
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - NICEGUI_STORAGE_PATH=/app/data/nicegui_storage
      # LLM Provider API Keys - Add your key here or use .env file (recommended)
      # Supports OpenAI, Anthropic, Google, and 100+ providers via LiteLLM
      # - OPENAI_API_KEY=sk-...
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - GEMINI_API_KEY=...
      # Optional: Model configuration (defaults: gpt-5-mini, gpt-5.1)
      # - LLM_MODEL_FAST=gpt-5-mini
      # - LLM_MODEL_QUALITY=gpt-5.1
      # - LLM_MODEL_DEFAULT=gpt-5-mini
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

